
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: transparent;
  }

  #candado {
    width: 100%;
    height: 100%;
    min-height: 90px;
    background: rgba(110, 28, 28, 0.94);
    color: white;
    border: 3px solid #e57373;
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    text-align: center;
    padding: 10px;
    cursor: not-allowed;
  }

  #candado strong {
    font-size: 18px;
  }

  #candado span {
    font-size: 13px;
  }
</style>
</head>
<body>

<div id="candado">
  <strong>🔒 Acceso bloqueado</strong>
  <span>Completa la etapa anterior</span>
</div>

</body>
</html>
