
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  background: transparent;
  font-family: Arial, sans-serif;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 80px;
}

button {
  width: 380px;
  max-width: 98%;
  height: 54px;
  border-radius: 999px;
  background: #006675;
  color: white;
  border: 3px solid #D4F4F1;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 3px 8px rgba(0,0,0,0.18);
}

button:hover {
  background: #087e87;
}
</style>
</head>

<body>

<button id="continuar" type="button">
  ➜ ATENDER AL SIGUIENTE PACIENTE
</button>

<script>
document.getElementById('continuar')
  .addEventListener('click', function () {

    const canal = new MessageChannel();

    canal.port1.onmessage = function (event) {
      const respuesta = event.data;

      if (respuesta?.correcto === false) {
        alert('Debes guardar el progreso del Paciente 2 antes de continuar.');
      }
    };

    window.top.postMessage(
      {
        tipo: 'CONTINUAR_RUTA',
        etapa: 'paciente_2',
        destino: 'paciente_3'
      },
      'https://obs208vina-cloud.github.io',
      [canal.port2]
    );
  });
</script>

</body>
</html>
