
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: transparent;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

button {
  width: 100%;
  height: 100%;
  border-radius: 999px;
  background: #006675;
  color: white;
  border: 3px solid #D4F4F1;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #087e87;
}

#mensaje {
  font-size: 13px;
  text-align: center;
  color: #9b2525;
}
</style>
</head>
<body>

<button id="continuar" type="button">
  ➜ ATENDER AL SIGUIENTE PACIENTE
</button>

<script>
document.getElementById('continuar')
  .addEventListener('click', function () {

    const canal = new MessageChannel();

    canal.port1.onmessage = function (event) {
      const respuesta = event.data;

      if (respuesta?.correcto === false) {
        alert('Debes guardar el progreso del Paciente 2 antes de continuar.');
      }
    };

    window.top.postMessage(
      {
        tipo: 'CONTINUAR_RUTA',
        etapa: 'paciente_2',
        destino: 'paciente_3'
      },
      'https://obs208vina-cloud.github.io',
      [canal.port2]
    );
  });
</script>

</body>
</html>
